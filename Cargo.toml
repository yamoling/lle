[package]
name = "lle"
version = "2.11.2"
edition = "2024"
description = "Cooperative MARL environment based on laser-blocking."
readme = "readme.md"
homepage = "https://github.com/yamoling/lle"
repository = "https://github.com/yamoling/lle"
license-file = "licence"
keywords = ["environment", "laser", "lle", "marl", "rl"]
categories = ["science"]

exclude = ["docs", "pyproject.toml", "python/*", "stubcheck.sh", "uv.lock"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "lle"
path = "src/lib.rs"

[[bin]]
name = "stub-gen"
path = "src/stub_gen.rs"
required-features = ["python-bindings"]

[dependencies]
image = { version = "0.25.5", default-features = false, features = ["png"] }
itertools = "0.14.0"
numpy = { version = "0.28.0", optional = true }
pyo3 = { version = "0.28.0", features = ["generate-import-lib"], optional = true }
pyo3-stub-gen = { version = "0.22.0", optional = true }
rand = "0.10.1"
serde = { version = "1.0.217", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1.0"

[dev-dependencies]
boon = "0.6.1"
rstest = "0.26.1"
rstest_reuse = "0.7.0"
serde_json = "1.0"

[build-dependencies]
image = { version = "0.25.5", default-features = false, features = ["png"] }

[features]
python-bindings = ["dep:numpy", "dep:pyo3", "dep:pyo3-stub-gen"]

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true
